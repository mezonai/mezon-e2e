name: 'Allure Daily Report - Deploy to Vercel'

on:
  # GitHub cron uses UTC:
  # - 13:00 UTC = 20:00 Vietnam: run Web and stage its raw results.
  # - 19:00 UTC = 02:00 Vietnam: run Multi, merge Web results, then deploy.
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      channel_management:
        description: 'ChannelManagement'
        type: boolean
        required: false
        default: false
      channel_message:
        description: 'ChannelMessage'
        type: boolean
        required: false
        default: false
      clan_management:
        description: 'ClanManagement'
        type: boolean
        required: false
        default: false
      direct_message:
        description: 'DirectMessage'
        type: boolean
        required: false
        default: false
      thread_management:
        description: 'ThreadManagement'
        type: boolean
        required: false
        default: false
      timeline:
        description: 'Timeline'
        type: boolean
        required: false
        default: false
      upload_file:
        description: 'UploadFile'
        type: boolean
        required: false
        default: false
      user_profile:
        description: 'UserProfile'
        type: boolean
        required: false
        default: false
      multi_channel_message:
        description: 'MultiChat / ChannelMessage'
        type: boolean
        required: false
        default: false
      multi_clan_management:
        description: 'MultiChat / ClanManagement'
        type: boolean
        required: false
        default: false
      multi_direct_message:
        description: 'MultiChat / DirectMessage'
        type: boolean
        required: false
        default: false
      multi_friend_management:
        description: 'MultiChat / FriendManagement'
        type: boolean
        required: false
        default: false
      multi_voice_channel:
        description: 'MultiChat / VoiceChannel'
        type: boolean
        required: false
        default: false
      multi_root_tests:
        description: 'MultiChat / root spec files'
        type: boolean
        required: false
        default: false

concurrency:
  group: allure-daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  allure-daily:
    runs-on: mezon-e2e

    # Job-level timeout: never let a hung step block the runner for hours
    timeout-minutes: 420

    env:
      ALLURE_VERCEL_ROOT: /home/nccsoft/allure-vercel-reports
      DEV_HOST_IP: 172.16.100.198
      DEV_MMN_HOST_IP: 172.16.100.180
      # Fixed browser path pre-installed on the VPS (one-time setup).
      # Playwright skips the download when the matching version already exists here.
      PLAYWRIGHT_BROWSERS_PATH: /home/member/pw-browsers

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout source code
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve run phase and report date
        id: phase
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          SELECTED_REF: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_SCHEDULE" = "0 13 * * *" ]; then
            RUN_PHASE="web"
            REPORT_MODE="daily"
            REPORT_DATE="$(TZ=UTC date -d tomorrow +%F)"
          elif [ "$EVENT_SCHEDULE" = "0 19 * * *" ]; then
            RUN_PHASE="multi"
            REPORT_MODE="daily"
            REPORT_DATE="$(TZ=UTC date -d tomorrow +%F)"
          else
            RUN_PHASE="manual"
            if [ "$SELECTED_REF" = "main" ]; then
              REPORT_MODE="daily"
            else
              REPORT_MODE="manual"
            fi
            REPORT_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi

          SAFE_REF="${SELECTED_REF//[^A-Za-z0-9._-]/_}"
          echo "phase=$RUN_PHASE" >> "$GITHUB_OUTPUT"
          echo "report_mode=$REPORT_MODE" >> "$GITHUB_OUTPUT"
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "pipeline_key=$REPORT_DATE-$SAFE_REF" >> "$GITHUB_OUTPUT"
          echo "Run phase: $RUN_PHASE"
          echo "Report mode: $REPORT_MODE"
          echo "Combined report date: $REPORT_DATE"
          echo "Pipeline key: $REPORT_DATE-$SAFE_REF"

      # chromedriver 149 requires Node.js 22 or newer. Do not rely on the
      # system-wide Node.js version installed on the self-hosted runner.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # -----------------------------------------------------------------------
      # 2. Install dependencies
      # -----------------------------------------------------------------------
      - name: Install dependencies
        timeout-minutes: 10
        run: yarn install

      # -----------------------------------------------------------------------
      # 3. Install Playwright browsers
      #    Near-instant no-op when the pinned version already exists in
      #    PLAYWRIGHT_BROWSERS_PATH; only downloads after a Playwright upgrade.
      # -----------------------------------------------------------------------
      - name: Install Playwright browsers
        timeout-minutes: 10
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: npx playwright install chromium

      # -----------------------------------------------------------------------
      # 4. Connect VPN — required to access dev-mezon.nccsoft.vn
      #    timeout-minutes guards against any hang (e.g. sudo password prompt).
      #    Requires NOPASSWD sudo rules on the VPS (see /etc/sudoers.d/gha-vpn).
      # -----------------------------------------------------------------------
      - name: Connect VPN
        timeout-minutes: 3
        env:
          VPN_OVPN_CONFIG: ${{ secrets.VPN_OVPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          # Fail fast if sudo would prompt for a password (that hang is invisible in CI)
          if ! sudo -n true 2>/dev/null; then
            echo "::error::sudo requires a password on this runner — add NOPASSWD rules (/etc/sudoers.d/gha-vpn)"
            exit 1
          fi

          echo "$VPN_OVPN_CONFIG" > /tmp/vpn-config.ovpn
          chmod 600 /tmp/vpn-config.ovpn

          printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" > /tmp/vpn-creds.txt
          chmod 600 /tmp/vpn-creds.txt

          # Recreate log/pid as root first (fs.protected_regular=2 workaround),
          # then chmod 666 so the non-root runner user can read them.
          sudo rm -f /tmp/openvpn.log /tmp/openvpn.pid
          sudo touch /tmp/openvpn.log /tmp/openvpn.pid
          sudo chmod 666 /tmp/openvpn.log /tmp/openvpn.pid

          # /dev/null redirects are required: without them the forked daemon
          # inherits this step's stdout pipe and the step never terminates.
          sudo openvpn --config /tmp/vpn-config.ovpn \
            --auth-user-pass /tmp/vpn-creds.txt \
            --daemon \
            --pull-filter ignore "redirect-gateway" \
            --route 172.16.100.0 255.255.255.0 \
            --log /tmp/openvpn.log \
            --writepid /tmp/openvpn.pid \
            < /dev/null > /dev/null 2>&1

          for i in $(seq 1 30); do
            if grep -q "Initialization Sequence Completed" /tmp/openvpn.log 2>/dev/null; then
              echo "VPN ready after ${i}s"
              rm -f /tmp/vpn-creds.txt
              exit 0
            fi
            sleep 1
          done

          echo "VPN did not initialize within 30s — log:"
          cat /tmp/openvpn.log
          rm -f /tmp/vpn-creds.txt
          exit 1

      # -----------------------------------------------------------------------
      # 5. Verify that the dev environment is reachable through the VPN
      # -----------------------------------------------------------------------
      - name: Verify dev environment access
        timeout-minutes: 1
        run: |
          echo "=== Checking VPN route ==="
          ROUTE=$(ip route get "$DEV_HOST_IP")
          echo "$ROUTE"

          if ! grep -q 'dev tun0' <<< "$ROUTE"; then
            echo "::error::$DEV_HOST_IP is not routed through tun0"
            exit 1
          fi

          echo "=== Checking dev-mezon ==="
          HTTP_CODE=$(curl \
            -sS \
            -4 \
            -L \
            --resolve "dev-mezon.nccsoft.vn:443:$DEV_HOST_IP" \
            -o /dev/null \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            https://dev-mezon.nccsoft.vn/) || {
              echo "::error::Cannot connect to dev-mezon.nccsoft.vn"
              exit 1
            }

          echo "HTTP status: $HTTP_CODE"

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 400 ]]; then
            echo "::error::dev-mezon.nccsoft.vn is not accessible. HTTP $HTTP_CODE"
            exit 1
          fi

          echo "dev-mezon.nccsoft.vn is accessible"

          echo "=== Checking dev-mezon API (port 7305) ==="
          API_HTTP_CODE=$(curl \
            -sS \
            -4 \
            --resolve "dev-mezon.nccsoft.vn:7305:$DEV_HOST_IP" \
            -o /dev/null \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            https://dev-mezon.nccsoft.vn:7305/) || {
              echo "::error::Cannot connect to dev-mezon API on port 7305"
              exit 1
            }

          echo "API HTTP status: $API_HTTP_CODE"

          if [[ "$API_HTTP_CODE" == "000" ]]; then
            echo "::error::dev-mezon API did not return an HTTP response"
            exit 1
          fi

          echo "dev-mezon API is reachable"

          echo "=== Checking dev-mezon WebSocket (port 4433) ==="
          SOCKET_HTTP_CODE=""
          if SOCKET_HTTP_CODE=$(curl \
            -sS \
            -4 \
            --resolve "dev-mezon-sock.nccsoft.vn:4433:$DEV_HOST_IP" \
            -o /dev/null \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            https://dev-mezon-sock.nccsoft.vn:4433/ws); then
            echo "WebSocket HTTP status: $SOCKET_HTTP_CODE"
            if [[ "$SOCKET_HTTP_CODE" == "000" ]]; then
              echo "::error::dev-mezon WebSocket did not return an HTTP response"
              exit 1
            fi
          else
            SOCKET_CURL_EXIT=$?
            if [[ "$SOCKET_CURL_EXIT" -eq 52 ]]; then
              # The socket server may close a plain HTTPS request without an
              # HTTP response because it expects a WebSocket upgrade + token.
              # curl 52 still proves DNS, TCP and TLS connectivity succeeded.
              echo "WebSocket endpoint is reachable (server requires a valid upgrade request)"
            else
              echo "::error::Cannot connect to dev-mezon WebSocket on port 4433 (curl exit $SOCKET_CURL_EXIT)"
              exit 1
            fi
          fi

          echo "dev-mezon WebSocket is reachable"

          echo "=== Checking dev-mmn route ==="
          MMN_ROUTE=$(ip route get "$DEV_MMN_HOST_IP")
          echo "$MMN_ROUTE"
          if ! grep -q 'dev tun0' <<< "$MMN_ROUTE"; then
            echo "::error::$DEV_MMN_HOST_IP is not routed through tun0"
            exit 1
          fi

          echo "=== Checking dev-mmn prove endpoint ==="
          MMN_HTTP_CODE=$(curl \
            -sS \
            -4 \
            -X POST \
            --resolve "dev-mmn.nccsoft.vn:443:$DEV_MMN_HOST_IP" \
            -o /dev/null \
            -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            https://dev-mmn.nccsoft.vn/zk-api//prove) || {
              echo "::error::Cannot connect to dev-mmn prove endpoint"
              exit 1
            }

          echo "MMN HTTP status: $MMN_HTTP_CODE"
          if [[ "$MMN_HTTP_CODE" == "000" ]]; then
            echo "::error::dev-mmn did not return an HTTP response"
            exit 1
          fi
          echo "dev-mmn is reachable"

      # -----------------------------------------------------------------------
      # 6. Create .env file
      # -----------------------------------------------------------------------
      - name: Create environment file
        run: |
          cat > .env << 'EOF'
          BASE_URL=https://dev-mezon.nccsoft.vn/
          DEV_HOST_IP=172.16.100.198
          DEV_MMN_HOST_IP=172.16.100.180
          WORKERS=1
          CI=true
          MEZON_NOTIFICATIONS=false
          TEST_GAP_MS=10000
          EOF
          sed -i 's/^[[:space:]]*//' .env
          echo "--- .env contents ---" && cat .env

      # -----------------------------------------------------------------------
      # 7. Run Playwright tests
      #    continue-on-error: true — test failures must NOT block report generation
      # -----------------------------------------------------------------------
      - name: Clean previous test artifacts
        run: npm run clean

      - name: Run Playwright tests
        id: run-tests
        timeout-minutes: 420
        env:
          RUN_PHASE: ${{ steps.phase.outputs.phase }}
          RUN_CHANNEL_MANAGEMENT: ${{ inputs.channel_management }}
          RUN_CHANNEL_MESSAGE: ${{ inputs.channel_message }}
          RUN_CLAN_MANAGEMENT: ${{ inputs.clan_management }}
          RUN_DIRECT_MESSAGE: ${{ inputs.direct_message }}
          RUN_THREAD_MANAGEMENT: ${{ inputs.thread_management }}
          RUN_TIMELINE: ${{ inputs.timeline }}
          RUN_UPLOAD_FILE: ${{ inputs.upload_file }}
          RUN_USER_PROFILE: ${{ inputs.user_profile }}
          RUN_MULTI_CHANNEL_MESSAGE: ${{ inputs.multi_channel_message }}
          RUN_MULTI_CLAN_MANAGEMENT: ${{ inputs.multi_clan_management }}
          RUN_MULTI_DIRECT_MESSAGE: ${{ inputs.multi_direct_message }}
          RUN_MULTI_FRIEND_MANAGEMENT: ${{ inputs.multi_friend_management }}
          RUN_MULTI_VOICE_CHANNEL: ${{ inputs.multi_voice_channel }}
          RUN_MULTI_ROOT_TESTS: ${{ inputs.multi_root_tests }}
        run: |
          WEB_TARGETS=()
          MULTI_TARGETS=()

          add_web_targets() {
            [ "$RUN_CHANNEL_MANAGEMENT" = "true" ] && WEB_TARGETS+=("src/tests/web/ChannelManagement")
            [ "$RUN_CHANNEL_MESSAGE" = "true" ] && WEB_TARGETS+=("src/tests/web/ChannelMessage")
            [ "$RUN_CLAN_MANAGEMENT" = "true" ] && WEB_TARGETS+=("src/tests/web/ClanManagement")
            [ "$RUN_DIRECT_MESSAGE" = "true" ] && WEB_TARGETS+=("src/tests/web/DirectMessage")
            [ "$RUN_THREAD_MANAGEMENT" = "true" ] && WEB_TARGETS+=("src/tests/web/ThreadManagement")
            [ "$RUN_TIMELINE" = "true" ] && WEB_TARGETS+=("src/tests/web/Timeline")
            [ "$RUN_UPLOAD_FILE" = "true" ] && WEB_TARGETS+=("src/tests/web/UploadFile")
            [ "$RUN_USER_PROFILE" = "true" ] && WEB_TARGETS+=("src/tests/web/UserProfile")
            return 0
          }

          add_multi_targets() {
            [ "$RUN_MULTI_CHANNEL_MESSAGE" = "true" ] && MULTI_TARGETS+=("src/tests/multi-chat/ChannelMessage")
            [ "$RUN_MULTI_CLAN_MANAGEMENT" = "true" ] && MULTI_TARGETS+=("src/tests/multi-chat/ClanManagement")
            [ "$RUN_MULTI_DIRECT_MESSAGE" = "true" ] && MULTI_TARGETS+=("src/tests/multi-chat/DirectMessage")
            [ "$RUN_MULTI_FRIEND_MANAGEMENT" = "true" ] && MULTI_TARGETS+=("src/tests/multi-chat/FriendManagement")
            [ "$RUN_MULTI_VOICE_CHANNEL" = "true" ] && MULTI_TARGETS+=("src/tests/multi-chat/VoiceChannel")

            if [ "$RUN_MULTI_ROOT_TESTS" = "true" ]; then
              MULTI_TARGETS+=(
                "src/tests/multi-chat/ChannelManagement"
                "src/tests/multi-chat/MarkAsRead"
                "src/tests/multi-chat/MemberManagement"
                "src/tests/multi-chat/UserSettings"
              )
            fi
            return 0
          }

          if [ "$RUN_PHASE" = "web" ]; then
            add_web_targets
            if [ "${#WEB_TARGETS[@]}" -eq 0 ]; then
              WEB_TARGETS=("src/tests/web")
              echo "No Web folder selected; running all Web tests."
            fi
          elif [ "$RUN_PHASE" = "multi" ]; then
            add_multi_targets
            if [ "${#MULTI_TARGETS[@]}" -eq 0 ]; then
              MULTI_TARGETS=("src/tests/multi-chat")
              echo "No Multi folder selected; running all MultiChat tests."
            fi
          elif [ "$RUN_PHASE" = "manual" ]; then
            add_web_targets
            add_multi_targets
            if [ "${#WEB_TARGETS[@]}" -eq 0 ] && [ "${#MULTI_TARGETS[@]}" -eq 0 ]; then
              WEB_TARGETS=("src/tests/web")
              MULTI_TARGETS=("src/tests/multi-chat")
              echo "No folder selected; running all Web and MultiChat tests."
            fi
          else
            echo "::error::Unknown run phase: $RUN_PHASE"
            exit 1
          fi

          TEST_EXIT_CODE=0
          set +e

          if [ "${#WEB_TARGETS[@]}" -gt 0 ]; then
            printf 'Selected web folder: %s\n' "${WEB_TARGETS[@]}"
            xvfb-run npx playwright test "${WEB_TARGETS[@]}" --project Chrome
            [ "$?" -ne 0 ] && TEST_EXIT_CODE=1
          fi

          if [ "${#MULTI_TARGETS[@]}" -gt 0 ]; then
            printf 'Selected multi-chat target: %s\n' "${MULTI_TARGETS[@]}"
            xvfb-run npx playwright test "${MULTI_TARGETS[@]}" --project Multi
            [ "$?" -ne 0 ] && TEST_EXIT_CODE=1
          fi

          set -e
          exit "$TEST_EXIT_CODE"
        continue-on-error: true

      # -----------------------------------------------------------------------
      # 8. Stage Web results or merge them into the Multi results
      # -----------------------------------------------------------------------
      - name: Stage Web results for the midnight report
        if: always() && steps.phase.outputs.phase == 'web'
        env:
          REPORT_DATE: ${{ steps.phase.outputs.report_date }}
          PIPELINE_KEY: ${{ steps.phase.outputs.pipeline_key }}
        run: |
          if [ ! -d "allure-results" ] || [ -z "$(find allure-results -maxdepth 1 -name '*-result.json' -print -quit)" ]; then
            echo "::error::Web run produced no Allure result files"
            exit 1
          fi

          PENDING_DIR="$ALLURE_VERCEL_ROOT/pending/$PIPELINE_KEY"
          WEB_RESULTS_DIR="$PENDING_DIR/web-results"
          mkdir -p "$PENDING_DIR"
          STAGING_DIR="$(mktemp -d "$PENDING_DIR/.web-results.XXXXXX")"
          cp -a allure-results/. "$STAGING_DIR/"
          rm -rf "$WEB_RESULTS_DIR"
          mv "$STAGING_DIR" "$WEB_RESULTS_DIR"

          RESULT_COUNT="$(find "$WEB_RESULTS_DIR" -maxdepth 1 -name '*-result.json' | wc -l)"
          echo "Staged $RESULT_COUNT Web results for combined report $REPORT_DATE"

      - name: Merge staged Web results into Multi results
        id: merge_results
        if: always() && steps.phase.outputs.phase == 'multi'
        env:
          REPORT_DATE: ${{ steps.phase.outputs.report_date }}
          PIPELINE_KEY: ${{ steps.phase.outputs.pipeline_key }}
        run: |
          WEB_RESULTS_DIR="$ALLURE_VERCEL_ROOT/pending/$PIPELINE_KEY/web-results"

          if [ ! -d "$WEB_RESULTS_DIR" ] || [ -z "$(find "$WEB_RESULTS_DIR" -maxdepth 1 -name '*-result.json' -print -quit)" ]; then
            echo "::error::No staged Web results found for $REPORT_DATE at $WEB_RESULTS_DIR"
            exit 1
          fi

          mkdir -p allure-results
          WEB_COUNT="$(find "$WEB_RESULTS_DIR" -maxdepth 1 -name '*-result.json' | wc -l)"
          MULTI_COUNT="$(find allure-results -maxdepth 1 -name '*-result.json' | wc -l)"
          cp -a "$WEB_RESULTS_DIR/." allure-results/
          COMBINED_COUNT="$(find allure-results -maxdepth 1 -name '*-result.json' | wc -l)"

          echo "Merged $WEB_COUNT Web results with $MULTI_COUNT Multi results"
          echo "Combined raw result count: $COMBINED_COUNT"

      # -----------------------------------------------------------------------
      # 9. Generate the combined report and deploy only after Multi
      # -----------------------------------------------------------------------
      - name: Generate Allure report and deploy to Vercel
        id: deploy_report
        if: always() && (steps.phase.outputs.phase == 'manual' || (steps.phase.outputs.phase == 'multi' && steps.merge_results.outcome == 'success'))
        # The generated archive can be several hundred MB. Keep enough time for
        # report generation, GitHub Release upload, and the Vercel deployment.
        timeout-minutes: 30
        env:
          ALLURE_VERCEL_ROOT: ${{ env.ALLURE_VERCEL_ROOT }}
          REPORT_DATE: ${{ steps.phase.outputs.report_date }}
          REPORT_MODE: ${{ steps.phase.outputs.report_mode }}
          REPORT_RUN_ID: ${{ github.run_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_ORG_ID: team_dZPIwRmKbB0nPB0li3Gmr3t8
          VERCEL_PROJECT_ID: prj_9IxF0sBzYsUNc3xbr09kzvmkBgp0
        run: |
          bash scripts/allure/allure-daily.sh

      - name: Clean staged Web results after successful daily deploy
        if: always() && steps.phase.outputs.phase == 'multi' && steps.deploy_report.outcome == 'success'
        env:
          PIPELINE_KEY: ${{ steps.phase.outputs.pipeline_key }}
        run: |
          PENDING_ROOT="$ALLURE_VERCEL_ROOT/pending"
          USED_PENDING_DIR="$PENDING_ROOT/$PIPELINE_KEY"

          if [[ "$USED_PENDING_DIR" != "$PENDING_ROOT/"* ]]; then
            echo "::error::Refusing to clean unexpected pending path: $USED_PENDING_DIR"
            exit 1
          fi

          rm -rf "$USED_PENDING_DIR"
          echo "Removed staged Web results: $USED_PENDING_DIR"

          if [ -d "$PENDING_ROOT" ]; then
            find "$PENDING_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -mtime +7 \
              -print \
              -exec rm -rf -- {} +
          fi

      # -----------------------------------------------------------------------
      # 10. Disconnect VPN — cleanup, always runs
      # -----------------------------------------------------------------------
      - name: Disconnect VPN
        if: always()
        timeout-minutes: 2
        run: |
          if [ -f /tmp/openvpn.pid ]; then
            sudo -n kill "$(cat /tmp/openvpn.pid)" 2>/dev/null || true
            sudo -n rm -f /tmp/openvpn.pid /tmp/openvpn.log /tmp/vpn-config.ovpn /tmp/vpn-creds.txt || true
            echo "VPN disconnected and config removed"
          else
            echo "No VPN PID file found, skipping disconnect"
          fi

      # -----------------------------------------------------------------------
      # 11. Upload Playwright diagnostics and Allure raw results
      # -----------------------------------------------------------------------
      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ steps.phase.outputs.phase }}-${{ steps.phase.outputs.report_date }}-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload allure-results artifact (debug fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ steps.phase.outputs.phase }}-${{ steps.phase.outputs.report_date }}-${{ github.run_id }}
          path: allure-results/
          retention-days: 3
          if-no-files-found: ignore
